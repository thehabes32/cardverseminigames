<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Profile — Cardverse Mini Games</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0813;--s:#161327;--s2:#1f1b38;--b:rgba(255,255,255,.10);--t:#f2f0ff;--m:rgba(242,240,255,.55);--a:#7c6cfc;--a2:#fc6c8f;--teal:#4ee0d6;--g:#3ecf8e;--r:#fc6c6c;--gold:#fcd96c;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--t);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;}
.space{position:fixed;inset:0;z-index:0;background:
 radial-gradient(90% 60% at 12% 4%,rgba(124,108,252,.34),transparent 52%),
 radial-gradient(80% 55% at 88% 10%,rgba(252,108,143,.26),transparent 52%),
 radial-gradient(70% 55% at 78% 60%,rgba(78,224,214,.16),transparent 55%),
 radial-gradient(90% 70% at 25% 85%,rgba(150,90,255,.20),transparent 55%),
 linear-gradient(180deg,#171233,#0f0a24 55%,#0a0718);}
.stars{position:fixed;inset:0;z-index:1;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle linear infinite alternate;}
.star.big{box-shadow:0 0 6px 1px rgba(255,255,255,.8),0 0 12px 3px rgba(150,180,255,.4);}
@keyframes twinkle{0%{opacity:.12}100%{opacity:.9}}

.wrap{max-width:620px;margin:0 auto;padding:1.6rem 1rem 4rem;position:relative;z-index:2;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.4rem;}
.mark{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--t);}
.mark img{width:32px;filter:drop-shadow(0 0 10px rgba(124,108,252,.7));}
.logo{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;letter-spacing:1px;}
.logo span{color:var(--a);}

/* HAMBURGER MENU */
.menu-wrap{position:relative;}
.hamburger{display:flex;flex-direction:column;justify-content:center;gap:4px;width:42px;height:42px;align-items:center;background:var(--s2);border:1px solid var(--b);border-radius:12px;cursor:pointer;}
.hamburger span{width:18px;height:2px;background:var(--t);border-radius:2px;transition:.2s;}
.hamburger.open span:nth-child(1){transform:translateY(6px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
.menu-dd{position:absolute;top:52px;right:0;min-width:190px;background:var(--s2);border:1px solid var(--b);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.5);padding:8px;z-index:60;display:none;}
.menu-dd.open{display:block;}
.menu-user{padding:8px 12px 10px;border-bottom:1px solid var(--b);margin-bottom:6px;}
.menu-user .mu-name{font-family:'Orbitron',sans-serif;font-weight:900;font-size:14px;}
.menu-user .mu-sub{font-size:10px;color:var(--m);font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.menu-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:800;color:var(--t);text-decoration:none;cursor:pointer;}
.menu-item:hover{background:var(--s);}
.menu-item.active{background:rgba(124,108,252,.18);color:var(--a);}
.menu-item .mi-ic{font-size:16px;width:20px;text-align:center;}
.menu-item.danger{color:var(--r);}
.menu-sep{height:1px;background:var(--b);margin:6px 4px;}

/* ===== PLAYER CARD (Madden-style, glowing tier border) ===== */
.feature{display:flex;justify-content:center;margin:6px 0 4px;}
.pcard{width:300px;border-radius:20px;padding:6px;position:relative;}
.pcard .inner{border-radius:15px;background:linear-gradient(180deg,#141024,#0b0916);overflow:hidden;position:relative;height:420px;display:flex;flex-direction:column;}
.pc-top{display:flex;justify-content:flex-end;align-items:flex-start;padding:14px 16px 0;z-index:2;}
.pc-ovr{text-align:center;line-height:1;}
.pc-ovr .n{font-family:'Orbitron',sans-serif;font-size:36px;font-weight:900;}
.pc-ovr .l{font-size:8px;font-weight:800;color:var(--m);letter-spacing:.16em;margin-top:2px;}
.pc-tier{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:7px;background:rgba(124,108,252,.25);color:#c9c0ff;}
.pc-char{flex:1;display:flex;align-items:center;justify-content:center;position:relative;}
.pc-char img{width:190px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6));position:relative;z-index:1;}
.pc-char .halo{position:absolute;width:220px;height:220px;border-radius:50%;filter:blur(34px);opacity:.55;background:#7c6cfc;animation:pulse 3.2s ease-in-out infinite;}
.pc-name{text-align:center;padding:12px;background:rgba(0,0,0,.35);z-index:2;}
.pc-name .u{font-family:'Orbitron',sans-serif;font-size:19px;font-weight:900;letter-spacing:.04em;}
.pc-name .s{font-size:10px;color:var(--m);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}

/* stats + progress */
.pc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:1.3rem;}
.pc-stat{background:var(--s2);border:1px solid var(--b);border-radius:14px;padding:.9rem .3rem;text-align:center;}
.pc-stat b{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;display:block;}
.pc-stat span{font-size:9px;color:var(--m);font-weight:800;text-transform:uppercase;letter-spacing:.05em;display:block;margin-top:3px;}
.pc-prog{margin-top:1rem;text-align:left;background:var(--s2);border:1px solid var(--b);border-radius:14px;padding:.9rem 1.1rem;}
.pc-prog .pl{font-size:11px;color:var(--m);font-weight:800;margin-bottom:8px;}
.pc-prog .pl b{color:var(--gold);}
.tbar{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;}
.tbar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .5s;}

/* ===== BORDER STYLES ===== */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.7}}
@keyframes drift{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.b-bronze{background:linear-gradient(135deg,#4a2f12,#9c6b2e,#3a2410);box-shadow:0 0 16px rgba(120,78,30,.5);}
.b-silver{background:linear-gradient(135deg,#9aa0aa,#e8edf5,#8b909a);box-shadow:0 0 18px rgba(200,210,225,.5);}
.b-gold{background:linear-gradient(135deg,#b8860b,#fcd96c,#a8760b);box-shadow:0 0 22px rgba(252,217,108,.55);}
.b-red{background:linear-gradient(135deg,#7a1420,#fc4444,#7a1420);box-shadow:0 0 24px rgba(252,68,68,.6);}
.b-diamond{background:linear-gradient(135deg,#2d7fd8,#8fd0ff,#1f5fb0);box-shadow:0 0 26px rgba(74,168,255,.7);}
.b-superfractor{background:conic-gradient(from 0deg,#fcd96c,#ff8a3c,#ff5c8a,#b56cff,#5cc8ff,#5cffa6,#ffe86c,#fcd96c);box-shadow:0 0 32px rgba(255,200,100,.75);}
.b-superfractor::after{content:'';position:absolute;inset:0;border-radius:20px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.5) 0deg 1deg,transparent 1deg 9deg);mix-blend-mode:overlay;pointer-events:none;}
.b-superfractor.anim{animation:spin 8s linear infinite;}
.b-amethyst{background:linear-gradient(135deg,#b34ce0,#f59bff,#7a2ea8);box-shadow:0 0 28px rgba(224,108,245,.65);}
.b-nebula{background:linear-gradient(120deg,#3a1c71,#d76d77,#4ee0d6,#7c6cfc,#3a1c71);background-size:200% 200%;box-shadow:0 0 36px rgba(124,108,252,.8);}
.b-nebula.anim{animation:drift 6s linear infinite;}

/* ===== BORDER LADDER ===== */
.seclbl{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--teal);text-transform:uppercase;text-align:center;margin:1.8rem 0 1rem;}
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
.trow{border-radius:14px;padding:3px;position:relative;}
.trow.locked{opacity:.4;}
.trow.current .ti{outline:2px solid rgba(124,108,252,.6);outline-offset:-2px;}
.trow .ti{background:#0e0b1a;border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;}
.tswatch{width:38px;height:52px;border-radius:6px;padding:3px;flex-shrink:0;}
.tswatch .c{width:100%;height:100%;border-radius:4px;background:#0b0916;}
.tinfo .nm{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;}
.tinfo .rq{font-size:10.5px;color:var(--m);font-weight:700;margin-top:3px;line-height:1.4;}
.tstat{margin-left:auto;font-size:15px;}
.tnum{position:absolute;top:8px;right:12px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;color:rgba(255,255,255,.28);}

.foot{text-align:center;font-family:'Orbitron',sans-serif;font-size:10px;color:rgba(242,240,255,.3);font-weight:700;letter-spacing:.3em;margin-top:1.6rem;}
</style>
</head>
<body>
<div class="space"></div>
<div class="stars" id="stars"></div>

<div class="wrap">
  <div class="header">
    <a class="mark" href="home.html">
      <img src="images/saucer.png" onerror="this.style.display='none'"/>
      <div class="logo">CARD<span>VERSE</span></div>
    </a>
    <div class="menu-wrap">
      <div class="hamburger" id="hamburger" onclick="toggleMenu(event)"><span></span><span></span><span></span></div>
      <div class="menu-dd" id="menu-dd">
        <div class="menu-user">
          <div class="mu-name" id="menu-name">Loading…</div>
          <div class="mu-sub" id="menu-tier">Collector</div>
        </div>
        <a class="menu-item" href="home.html"><span class="mi-ic">🎮</span> Games</a>
        <a class="menu-item active" href="profile.html"><span class="mi-ic">👤</span> Profile</a>
        <div class="menu-sep"></div>
        <div class="menu-item danger" onclick="signOut()"><span class="mi-ic">⎋</span> Sign out</div>
      </div>
    </div>
  </div>

  <div class="feature">
    <div class="pcard b-bronze" id="pcard">
      <div class="inner">
        <div class="pc-top">
          <div class="pc-tier" id="pc-tier">Bronze</div>
        </div>
        <div class="pc-char">
          <div class="halo" id="pc-halo"></div>
          <img src="images/saucer.png" onerror="this.style.display='none'"/>
        </div>
        <div class="pc-name">
          <div class="u" id="pc-name">Player</div>
          <div class="s" id="pc-sub">New collector</div>
        </div>
      </div>
    </div>
  </div>

  <div class="pc-stats">
    <div class="pc-stat"><b id="pc-streak">0</b><span>Best Streak</span></div>
    <div class="pc-stat"><b id="pc-pts">0</b><span>Total Pts</span></div>
    <div class="pc-stat"><b id="pc-days">0</b><span>Days Played</span></div>
  </div>

  <div class="pc-prog">
    <div class="pl" id="pc-next">🔓 Keep playing to rank up</div>
    <div class="tbar"><span id="pc-bar" style="width:0%"></span></div>
  </div>

  <div class="seclbl">◆ The Border Ladder ◆</div>
  <div class="ladder" id="ladder"></div>

  <div class="foot">◇ CARDVERSE MINI GAMES ◇</div>
</div>

<script>
const SB_URL='https://nwzsomfhidefbldsloxz.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53enNvbWZoaWRlZmJsZHNsb3h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODY3MTAsImV4cCI6MjA5MDQ2MjcxMH0.YmXfQ4DtaYVP09fvAuPTveYSKxqXxw3kcXxGGcJH-jA';
const sb=supabase.createClient(SB_URL,SB_ANON);

const starsEl=document.getElementById('stars');
for(let i=0;i<180;i++){
  const s=document.createElement('div');
  const big=Math.random()<0.10;
  s.className='star'+(big?' big':'');
  const sz=big?(Math.random()*1.6+2.2):(Math.random()*1.8+.4);
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s;`;
  starsEl.appendChild(s);
}

// tier defs: border class, glow color, unlock rule, ladder blurb
const TIERS=[
  {n:'Bronze',        bcls:'b-bronze',           glow:'#9c6b2e', days:0,   streak:0,  pts:0,      rq:'Everyone starts here'},
  {n:'Silver',        bcls:'b-silver',           glow:'#e8edf5', days:3,   streak:5,  pts:500,    rq:'Play 3 days or a 5 streak'},
  {n:'Gold',          bcls:'b-gold',             glow:'#fcd96c', days:7,   streak:10, pts:1000,   rq:'Play 7 days or a 10 streak'},
  {n:'Elite',         bcls:'b-red',              glow:'#fc4444', days:14,  streak:15, pts:5000,   rq:'Play 14 days or a 15 streak'},
  {n:'Diamond',       bcls:'b-diamond',          glow:'#8fd0ff', days:30,  streak:20, pts:15000,  rq:'Play 30 days or a 20 streak'},
  {n:'Superfractor',  bcls:'b-superfractor',     glow:'#ffc864', days:60,  streak:99, pts:30000,  rq:'60 days or a perfect board'},
  {n:'Pink Amethyst', bcls:'b-amethyst',         glow:'#f59bff', days:120, streak:99, pts:50000,  rq:'120 days or elite points'},
  {n:'Nebula',        bcls:'b-nebula anim',      glow:'#7c6cfc', days:250, streak:99, pts:100000, rq:'250 days — top dog'},
];

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    if(sessionStorage.getItem('cv_guest')==='1'){ render({username:'Guest',best_streak:0,total_pts:0,days_played:0}); return; }
    window.location.href='login.html'; return;
  }
  const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  render(p || {username:(session.user.email||'Player').split('@')[0],best_streak:0,total_pts:0,days_played:0});
}

function render(p){
  const name=p.username||'Player';
  const days=p.days_played||0, streak=p.best_streak||0, pts=p.total_pts||0;
  let cur=0;
  for(let i=1;i<TIERS.length;i++){ const T=TIERS[i]; if(days>=T.days||streak>=T.streak||pts>=T.pts) cur=i; }
  const now=TIERS[cur];

  // menu
  document.getElementById('menu-name').textContent=name;
  document.getElementById('menu-tier').textContent=now.n+' · Level '+(cur+1);

  // card
  document.getElementById('pcard').className='pcard '+now.bcls;
  document.getElementById('pc-tier').textContent=now.n;
  document.getElementById('pc-halo').style.background=now.glow;
  document.getElementById('pc-name').textContent=name;
  document.getElementById('pc-sub').textContent = streak>0 ? (streak+'-day streak · '+now.n) : (now.n+' tier · Level '+(cur+1));

  // stats
  document.getElementById('pc-streak').textContent=streak;
  document.getElementById('pc-pts').textContent=pts.toLocaleString();
  document.getElementById('pc-days').textContent=days;

  // progress
  if(cur>=TIERS.length-1){
    document.getElementById('pc-next').innerHTML='👑 Top dog — every border unlocked';
    document.getElementById('pc-bar').style.width='100%';
  } else {
    const nx=TIERS[cur+1];
    const opts=[
      {lbl:Math.max(0,nx.pts-pts).toLocaleString()+' pts', have:pts, need:nx.pts},
      {lbl:Math.max(0,nx.streak-streak)+' more streak', have:streak, need:nx.streak},
      {lbl:Math.max(0,nx.days-days)+' more days', have:days, need:nx.days}
    ].filter(o=>o.need<99999);
    opts.forEach(o=>o.pct=o.need?Math.min(1,o.have/o.need):1);
    opts.sort((a,b)=>b.pct-a.pct);
    const best=opts[0];
    document.getElementById('pc-next').innerHTML='🔓 <b>'+best.lbl+'</b> until '+nx.n;
    document.getElementById('pc-bar').style.width=Math.round(best.pct*100)+'%';
  }

  // ladder
  document.getElementById('ladder').innerHTML=TIERS.map((T,i)=>{
    const unlocked=i<=cur, isNow=i===cur;
    return `<div class="trow ${T.bcls} ${unlocked?'':'locked'} ${isNow?'current':''}">
      <div class="tnum">${i+1}</div>
      <div class="ti">
        <div class="tswatch ${T.bcls}"><div class="c"></div></div>
        <div class="tinfo"><div class="nm">${T.n}</div><div class="rq">${isNow?'Your current border':T.rq}</div></div>
        <div class="tstat">${unlocked?'✓':'🔒'}</div>
      </div>
    </div>`;
  }).join('');
}

function toggleMenu(e){
  if(e) e.stopPropagation();
  document.getElementById('menu-dd').classList.toggle('open');
  document.getElementById('hamburger').classList.toggle('open');
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.menu-wrap')){
    document.getElementById('menu-dd').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
  }
});
async function signOut(){ await sb.auth.signOut(); window.location.href='login.html'; }

init();
</script>
</body>
</html>
