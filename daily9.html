<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>The Daily 9 — Cardverse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f0e17;--s:#1a1928;--s2:#232235;--b:rgba(255,255,255,.09);--t:#f2f0ff;--m:rgba(242,240,255,.5);--a:#7c6cfc;--a2:#fc6c8f;--g:#3ecf8e;--r:#fc6c6c;--gold:#fcd96c;}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;}
body{background:var(--bg);color:var(--t);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;}
.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle linear infinite;}
@keyframes twinkle{0%,100%{opacity:.06}50%{opacity:.7}}
.glow{position:fixed;top:-180px;left:50%;transform:translateX(-50%);width:640px;height:460px;background:radial-gradient(closest-side,rgba(124,108,252,.22),transparent);pointer-events:none;z-index:0;}
.glow2{position:fixed;bottom:-220px;right:-140px;width:480px;height:420px;background:radial-gradient(closest-side,rgba(252,108,143,.1),transparent);pointer-events:none;z-index:0;}
.wrap{max-width:520px;margin:0 auto;padding:1.4rem 1rem 4rem;position:relative;z-index:1;}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.6rem;}
.logo{font-size:16px;font-weight:900;letter-spacing:-.2px;}
.logo span{color:var(--a);}
.top-right{display:flex;gap:7px;}
.pill{display:flex;align-items:center;gap:5px;background:var(--s);border:1px solid var(--b);border-radius:99px;padding:.32rem .8rem;font-size:11.5px;font-weight:900;}
.pill.fire{color:var(--gold);}
.pill.day{color:var(--m);}

.title{text-align:center;font-size:38px;font-weight:900;letter-spacing:-.7px;line-height:1;}
.title em{font-style:normal;background:linear-gradient(92deg,var(--a) 0%,var(--a2) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{text-align:center;font-size:11.5px;color:var(--m);font-weight:800;margin:.55rem 0 1.4rem;text-transform:uppercase;letter-spacing:.11em;}

/* 9-pip progress that mirrors the share grid */
.pips{display:flex;justify-content:center;gap:7px;margin-bottom:1.35rem;}
.pip{width:26px;height:8px;border-radius:99px;background:var(--s2);border:1px solid var(--b);transition:all .3s;}
.pip.on-right{background:var(--g);border-color:var(--g);box-shadow:0 0 10px rgba(62,207,142,.4);}
.pip.on-wrong{background:var(--r);border-color:var(--r);}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:1.1rem;perspective:900px;}
.sq{aspect-ratio:1/1;background:linear-gradient(155deg,var(--s) 0%,#161525 100%);border:1.5px solid var(--b);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;position:relative;overflow:hidden;}
.sq::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,var(--tint,transparent) 0%,transparent 60%);opacity:.22;}
.sq:hover{border-color:var(--tint,var(--a));transform:translateY(-4px) scale(1.015);box-shadow:0 14px 34px rgba(0,0,0,.45);}
.sq .chip{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(150deg,var(--tint,var(--s2)),rgba(0,0,0,.28)) ,var(--tint,var(--s2));box-shadow:0 6px 16px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.18);position:relative;z-index:1;}
.sq .nm{font-size:10px;font-weight:900;color:var(--t);text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:0 5px;position:relative;z-index:1;opacity:.9;}
.sq .live-dot{position:absolute;top:9px;left:11px;font-size:7.5px;font-weight:900;color:var(--g);letter-spacing:.08em;z-index:1;text-shadow:0 0 8px rgba(62,207,142,.6);}
.sq.done{cursor:default;}
.sq.done:hover{transform:none;box-shadow:none;}
.sq.done .chip{opacity:.55;}
.sq.done .nm{opacity:.5;}
.sq.right{border-color:rgba(62,207,142,.55);animation:flipIn .45s;}
.sq.right::before{background:radial-gradient(120% 90% at 50% 0%,var(--g) 0%,transparent 65%);opacity:.2;}
.sq.wrong{border-color:rgba(252,108,108,.5);animation:flipIn .45s;}
.sq.wrong::before{background:radial-gradient(120% 90% at 50% 0%,var(--r) 0%,transparent 65%);opacity:.16;}
@keyframes flipIn{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.sq .mark{position:absolute;top:8px;right:10px;font-size:15px;z-index:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));}

.modal{position:fixed;inset:0;background:rgba(10,9,16,.88);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:50;}
@media(min-width:600px){.modal{align-items:center;}}
.modal.show{display:flex;}
.q-card{background:var(--s);border:1.5px solid var(--b);border-top:none;border-radius:26px 26px 0 0;padding:0 1.35rem 2rem;max-width:480px;width:100%;max-height:92vh;overflow-y:auto;animation:rise .3s cubic-bezier(.2,.9,.3,1.05);position:relative;}
.q-card::before{content:'';position:sticky;top:0;display:block;height:4px;margin:0 -1.35rem 1.3rem;background:linear-gradient(90deg,var(--tint,var(--a)),transparent 80%);border-radius:26px 26px 0 0;}
@media(min-width:600px){.q-card{border-radius:26px;padding-bottom:1.5rem;border-top:1.5px solid var(--b);}}
@keyframes rise{0%{transform:translateY(44px);opacity:0}100%{transform:translateY(0);opacity:1}}
.q-head{display:flex;align-items:center;gap:10px;margin-bottom:1rem;}
.q-chip{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--tint,var(--s2));box-shadow:0 5px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15);}
.q-cat{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;}
.q-live{font-size:8.5px;font-weight:900;color:var(--g);letter-spacing:.08em;display:block;margin-top:1px;}
.q-count{margin-left:auto;font-size:11px;font-weight:800;color:var(--m);background:var(--s2);border-radius:99px;padding:.25rem .7rem;}
.q-text{font-size:17px;font-weight:800;line-height:1.45;margin-bottom:1rem;}
.q-img-wrap{display:flex;justify-content:center;margin-bottom:1rem;}
.q-img{max-width:100%;max-height:215px;border-radius:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);background:#111;}
.opt{display:flex;align-items:center;gap:11px;width:100%;background:var(--s2);border:1.5px solid var(--b);border-radius:14px;padding:.82rem .9rem;margin-bottom:.55rem;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--t);cursor:pointer;text-align:left;transition:border-color .13s,background .13s,transform .13s;}
.opt:hover{border-color:var(--a);transform:translateX(3px);}
.opt .ltr{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--m);flex-shrink:0;}
.opt.correct{border-color:var(--g);background:rgba(62,207,142,.14);}
.opt.correct .ltr{background:var(--g);color:#0b2418;}
.opt.incorrect{border-color:var(--r);background:rgba(252,108,108,.11);}
.opt.incorrect .ltr{background:var(--r);color:#2c0d0d;}

.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:.4rem;}
.duel-card{background:var(--s2);border:2px solid var(--b);border-radius:17px;padding:.7rem;cursor:pointer;text-align:center;transition:border-color .15s,transform .15s;}
.duel-card:hover{border-color:var(--a);transform:translateY(-3px);}
.duel-card img{width:100%;aspect-ratio:2/3;object-fit:contain;border-radius:10px;background:#111;margin-bottom:.5rem;}
.duel-name{font-size:12px;font-weight:900;line-height:1.3;}
.duel-meta{font-size:10.5px;color:var(--m);font-weight:800;margin-top:2px;}
.duel-pop{font-size:13px;font-weight:900;color:var(--gold);margin-top:5px;visibility:hidden;}
.duel-card.correct{border-color:var(--g);background:rgba(62,207,142,.1);}
.duel-card.incorrect{border-color:var(--r);background:rgba(252,108,108,.08);}
.duel-card.reveal .duel-pop{visibility:visible;}

/* card vs world versus layout */
.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin-bottom:.4rem;}
.vs-side{background:var(--s2);border:2px solid var(--b);border-radius:17px;padding:.75rem .6rem;cursor:pointer;text-align:center;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;}
.vs-side:hover{border-color:var(--a);transform:translateY(-3px);}
.vs-side img{width:100%;max-height:150px;object-fit:contain;border-radius:9px;background:#111;}
.vs-emoji{font-size:52px;line-height:1.4;filter:drop-shadow(0 5px 14px rgba(0,0,0,.4));}
.vs-name{font-size:12px;font-weight:900;line-height:1.35;}
.vs-price{font-size:13px;font-weight:900;color:var(--gold);visibility:hidden;}
.vs-side.reveal .vs-price{visibility:visible;}
.vs-side.correct{border-color:var(--g);background:rgba(62,207,142,.1);}
.vs-side.incorrect{border-color:var(--r);background:rgba(252,108,108,.08);}
.vs-mid{display:flex;align-items:center;font-size:13px;font-weight:900;color:var(--m);}

.q-after{display:none;margin-top:.7rem;}
.q-after.show{display:block;animation:fadeUp .3s;}
@keyframes fadeUp{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
.q-fact{font-size:13px;color:var(--m);line-height:1.6;font-weight:700;background:var(--s2);border:1px solid var(--b);border-left:3px solid var(--tint,var(--a));border-radius:13px;padding:.8rem .95rem;margin-bottom:.85rem;}
.q-fact b{color:var(--gold);}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:.9rem;font-family:'Nunito',sans-serif;font-size:14px;font-weight:900;cursor:pointer;transition:opacity .15s,transform .15s;}
.btn:hover{opacity:.92;transform:translateY(-1px);}
.btn-a{background:linear-gradient(92deg,var(--a),#5b4bd4);color:#fff;box-shadow:0 6px 20px rgba(124,108,252,.35);}

.result{display:none;background:linear-gradient(160deg,var(--s) 0%,#161525 100%);border:1.5px solid var(--b);border-radius:26px;padding:1.7rem 1.4rem;text-align:center;margin-bottom:1rem;animation:fadeUp .4s;position:relative;overflow:hidden;}
.result.show{display:block;}
.result.gem{border-color:rgba(252,217,108,.55);box-shadow:0 0 44px rgba(252,217,108,.15);}
.res-lbl{font-size:11px;font-weight:900;color:var(--m);text-transform:uppercase;letter-spacing:.12em;margin-bottom:.4rem;}
.result.gem .res-lbl{color:var(--gold);}
.res-big{font-size:54px;font-weight:900;line-height:1;}
.res-big span{color:var(--m);font-size:24px;}
.res-msg{font-size:13.5px;color:var(--m);font-weight:800;margin:.55rem 0 1rem;}
.res-grid{font-size:23px;letter-spacing:4px;line-height:1.5;margin-bottom:1.15rem;white-space:pre;}
.res-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1.15rem;}
.res-stat{background:var(--s2);border:1px solid var(--b);border-radius:14px;padding:.65rem .3rem;}
.res-stat .v{font-size:19px;font-weight:900;}
.res-stat .l{font-size:9.5px;font-weight:800;color:var(--m);text-transform:uppercase;letter-spacing:.05em;margin-top:1px;}
.next-in{font-size:11.5px;color:var(--m);font-weight:800;margin-top:1rem;}
.next-in b{color:var(--t);}
.confetti{position:absolute;top:-10px;font-size:18px;animation:fall linear forwards;pointer-events:none;}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(340px) rotate(340deg);opacity:0}}
.home-link{display:block;text-align:center;margin-top:1.4rem;font-size:12px;font-weight:800;color:var(--m);text-decoration:none;}
.home-link:hover{color:var(--a);}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--s2);border:1px solid var(--a);color:var(--t);border-radius:99px;padding:.6rem 1.3rem;font-size:13px;font-weight:800;transition:transform .25s;z-index:99;}
.toast.show{transform:translateX(-50%) translateY(0);}
.dealing{text-align:center;font-size:12px;color:var(--m);font-weight:800;padding:2.4rem 0;}
.dealing .spin{display:inline-block;animation:spinCard 1s ease-in-out infinite;font-size:22px;margin-bottom:.4rem;}
@keyframes spinCard{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
</style>
</head>
<body>

    </div>
  </div>

  <div class="title">The <em>Daily 9</em></div>
  <div class="sub">Real cards · real pops · real prices · one board a day</div>

  <div class="pips" id="pips"></div>

  <div class="dealing" id="dealing"><div class="spin">🃏</div><br/>Dealing today's board…</div>
  <div class="grid" id="grid" style="display:none;"></div>

  <div class="result" id="result">
    <div class="res-lbl" id="res-lbl">Today's board</div>

    <button class="btn btn-a" onclick="copyShare()">Share my board</button>
    <div class="next-in">Next board in <b id="countdown">—</b></div>
  </div>

  <a class="home-link" href="home.html">‹ Back to Cardverse</a>
</div>

<div class="modal" id="modal">

      <div class="q-chip" id="q-chip"></div>

        <div class="q-cat" id="q-cat"></div>

    <div class="q-text" id="q-text"></div>
    <div class="q-img-wrap" id="q-img-wrap" style="display:none;"><img class="q-img" id="q-img"/></div>
    <div id="q-body"></div>
    <div class="q-after" id="q-after">
      <div class="q-fact" id="q-fact"></div>
      <button class="btn btn-a" onclick="closeModal()">Back to board</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

  {q:'Tom Brady\'s most valuable rookie comes from which 2000 product?', opts:['Bowman Chrome','Playoff Contenders','SP Authentic','Fleer Autographics'], ans:1, fact:'The <b>2000 Playoff Contenders Championship Ticket</b> /100 — a football grail.'},
 ],
 slang:[
  {q:'In breaker culture, what is a "razz"?', opts:['A damaged card','A raffle for a spot or card','A fake patch','A bulk lot'], ans:1, fact:'A <b>mini-raffle</b> — buy spots for a shot at a card or break spot.'},
  {q:'"Mojo" in a break means…', opts:['A big hit / hot streak','A fake card','A refund','A trade offer'], ans:0, fact:'When the <b>mojo</b> is flowing, the hits keep coming. Allegedly.'},
  {q:'A "slab" is…', opts:['A thick patch card','A graded card in its case','A sealed box','A display shelf'], ans:1, fact:'The <b>graded, encapsulated card</b> — slab life.'},
  {q:'"PC" stands for…', opts:['Price check','Personal collection','Pack cost','Premium card'], ans:1, fact:'<b>Personal collection</b> — the cards you\'d never sell. In theory.'},
  {q:'A "whale" in the hobby is…', opts:['An oversized card','A huge spender','A card doctor','A group breaker'], ans:1, fact:'The <b>big spender</b> every auction house and breaker wants in the room.'},
 ],
 autofallback:[
  {q:'An "on-card" auto beats a sticker auto because…', opts:['It\'s bigger','The player signed the actual card','It\'s always numbered','Stickers fade'], ans:1, fact:'<b>Signed directly on the card</b> — collectors pay the premium every time.'},
  {q:'What is a "cut signature" card?', opts:['A damaged auto','A signature cut from elsewhere, embedded in a card','A short signature','A printed copy'], ans:1, fact:'A <b>cut auto</b> — how legends like Ruth "sign" modern cards.'},
  {q:'Pack-pulled autographs are signed…', opts:['By the manufacturer for the player','By the player for the manufacturer','By store owners','They\'re printed on'], ans:1, fact:'Players sign <b>for the manufacturer</b> — on-card, or on stickers applied later.'},
 ],
};

// ── THE BOARD ──
const CATS=[
 {id:'price',   ico:'💰', nm:'Price Check',    tint:'#3ecf8e', live:true},
 {id:'auto',    ico:'✍️', nm:'Guess the Auto', tint:'#fc6c8f', live:true},
 {id:'popduel', ico:'🔢', nm:'Pop Count',      tint:'#7c6cfc', live:true},
 {id:'whale',   ico:'🐋', nm:'Whale Math',     tint:'#3e8fcf', live:true},
 {id:'world',   ico:'🌍', nm:'Card vs World',  tint:'#4ecfc0', live:true},
 {id:'casehits',ico:'🎆', nm:'Case Hits',      tint:'#cf9b3e', bank:'casehits'},
 {id:'grails',  ico:'🐐', nm:'Grail Watch',    tint:'#e0b422', bank:'grails'},
 {id:'rookies', ico:'🌟', nm:'Rookie Year',    tint:'#b0682e', bank:'rookies'},
 {id:'slang',   ico:'🗣️', nm:'Hobby Slang',    tint:'#8a6dcf', bank:'slang'},
];

if(location.hash==='#reset'){ localStorage.removeItem('d9_'+dateKey); history.replaceState(null,'',location.pathname); }
let state=null;
try{ state=JSON.parse(localStorage.getItem('d9_'+dateKey)); }catch(e){}
if(!state) state={results:Array(9).fill(null),score:0,answered:0};
let meta=null;
try{ meta=JSON.parse(localStorage.getItem('d9_meta')); }catch(e){}
if(!meta) meta={streak:0,played:0,best:0,lastDone:null};
document.getElementById('streak-n').textContent=meta.streak;
function saveState(){ localStorage.setItem('d9_'+dateKey,JSON.stringify(state)); }
function saveMeta(){ localStorage.setItem('d9_meta',JSON.stringify(meta)); }

const starsEl=document.getElementById('stars');
for(let i=0;i<60;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2+.5;s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*3}s;`;starsEl.appendChild(s);}

// pips
const pipsEl=document.getElementById('pips');
for(let i=0;i<9;i++){const p=document.createElement('div');p.className='pip';p.id='pip-'+i;pipsEl.appendChild(p);}

const todayQ=Array(9).fill(null);
function pickBank(bankName,offset){ const b=BANKS[bankName]; return Object.assign({type:'trivia'},b[(dayNum+offset*3)%b.length]); }
function withTimeout(p,ms){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]); }
function shuffleSeeded(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
const fmt=v=>'$'+Math.round(v).toLocaleString();

async function buildLive(){
  CATS.forEach((c,i)=>{ if(c.bank) todayQ[i]=pickBank(c.bank,i); });
  // fallbacks for live squares
  todayQ[0]=Object.assign({type:'trivia'},{q:'"Comps" is hobby short for…',opts:['Competitions','Comparable sales','Complete sets','Compensations'],ans:1,fact:'<b>Comparable sales</b> — recent sold prices that set a card\'s real value.'});
  todayQ[1]=Object.assign({type:'trivia'},BANKS.autofallback[dayNum%BANKS.autofallback.length]);
  todayQ[2]=Object.assign({type:'trivia'},{q:'All else equal, a higher pop count means…',opts:['Higher value','Lower value','No effect','Faster grading'],ans:1,fact:'<b>Scarcity is the engine.</b> More gems = less premium.'});
  todayQ[3]=Object.assign({type:'trivia'},{q:'A "whale" in the hobby is…',opts:['An oversized card','A huge spender','A card doctor','A group breaker'],ans:1,fact:'The <b>big spender</b> every auction house wants in the room.'});
  todayQ[4]=Object.assign({type:'trivia'},{q:'Which typically costs more?',opts:['A PSA 10 1986 Fleer Jordan','A new Tesla Model 3'],ans:0,fact:'The Jordan\'s last sale was <b>$384K</b> — about nine Teslas.'});

  if(!sb) return;
  try{
    const {data:autos}=await withTimeout(sb.from('autograph_puzzles').select('player_name,sport,autograph_img').eq('status','active').not('autograph_img','is',null).limit(400),4000);
    if(autos&&autos.length>=4){
      const pick=autos[Math.floor(rng()*autos.length)];
      const others=autos.filter(a=>a.player_name!==pick.player_name);
      const same=others.filter(a=>a.sport===pick.sport);
      const pool=(same.length>=3?same:others).slice();
      const decoys=[];
      while(decoys.length<3&&pool.length){ const d=pool.splice(Math.floor(rng()*pool.length),1)[0]; if(!decoys.includes(d.player_name)) decoys.push(d.player_name); }
      if(decoys.length===3){
        const opts=shuffleSeeded([pick.player_name,...decoys]);
        todayQ[1]={type:'image',q:'Whose autograph is this?',img:pick.autograph_img,opts,ans:opts.indexOf(pick.player_name),fact:'That\'s <b>'+pick.player_name+'</b>. Play SIGNTVRE for a full mystery auto every day.'};
      }
    }
  }catch(e){}

  try{
    const {data:cards}=await withTimeout(sb.from('pr_cards').select('player,year,set_name,pop,img,last_price').eq('status','active').not('img','is',null).gt('pop',0).order('spec_id',{ascending:true}).limit(1500),5000);
    if(cards&&cards.length>=20){
      // POP COUNT duel
      let A=null,B=null;
      for(let t=0;t<60&&!B;t++){
        A=cards[Math.floor(rng()*cards.length)];
        const cands=cards.filter(c=>c!==A&&c.pop!==A.pop&&Math.max(c.pop,A.pop)/Math.min(c.pop,A.pop)<=2.5);
        if(cands.length) B=cands[Math.floor(rng()*cands.length)];
      }
      if(A&&B){
        const pair=rng()<.5?[A,B]:[B,A];
        todayQ[2]={type:'duel',q:'Which card has the LOWER PSA 10 pop?',cards:pair,ans:pair[0].pop<pair[1].pop?0:1,
          fact:'<b>'+pair[0].player+'</b>: pop '+pair[0].pop.toLocaleString()+' · <b>'+pair[1].player+'</b>: pop '+pair[1].pop.toLocaleString()+'. Live PSA data — play Pop Report for the full streak game.'};
      }
      const priced=cards.filter(c=>c.last_price&&c.last_price>=25);
      // PRICE CHECK
      if(priced.length){
        const P=priced[Math.floor(rng()*priced.length)];
        const real=Math.round(P.last_price);
        const opts=shuffleSeeded([real,Math.round(real*0.4),Math.round(real*2.2),Math.round(real*5.1)]);
        todayQ[0]={type:'image',q:'What did this card last sell for? ('+(P.year||'')+' '+(P.set_name||'')+' '+P.player+', PSA 10)',img:P.img,opts:opts.map(fmt),ans:opts.indexOf(real),
          fact:'Sold for <b>'+fmt(real)+'</b>. Real sale, real card — straight from our market data.'};
      }
      // WHALE MATH — how many of the cheap card = one big card
      const cheap=priced.filter(c=>c.last_price>=25&&c.last_price<=250);
      const big=priced.filter(c=>c.last_price>=2000);
      if(cheap.length&&big.length){
        let C=null,E=null,ratio=0;
        for(let t=0;t<60;t++){
          C=cheap[Math.floor(rng()*cheap.length)];
          E=big[Math.floor(rng()*big.length)];
          ratio=Math.round(E.last_price/C.last_price);
          if(ratio>=8&&ratio<=900) break;
        }
        if(ratio>=8){
          const opts=shuffleSeeded([ratio,Math.max(2,Math.round(ratio*0.35)),Math.round(ratio*2.6),Math.round(ratio*6)]);
          todayQ[3]={type:'image',q:'About how many PSA 10 '+C.player+' ('+(C.set_name||'')+') would it take to buy ONE PSA 10 '+E.player+' ('+(E.set_name||'')+')?',img:E.img,
            opts:opts.map(o=>'~'+o.toLocaleString()+' cards'),ans:opts.indexOf(ratio),
            fact:'<b>'+C.player+'</b> last sold for '+fmt(C.last_price)+' — the <b>'+E.player+'</b> went for '+fmt(E.last_price)+'. That\'s ~'+ratio.toLocaleString()+' to one. 🐋'};
        }
      }
      // CARD vs WORLD
      if(priced.length){
        let P2=null,W=null;
        for(let t=0;t<80;t++){
          P2=priced[Math.floor(rng()*priced.length)];
          const cands=WORLD.filter(w=>{const r=Math.max(w.p,P2.last_price)/Math.min(w.p,P2.last_price);return r>=1.5&&r<=6;});
          if(cands.length){ W=cands[Math.floor(rng()*cands.length)]; break; }
        }
        if(P2&&W){
          const cardSide={kind:'card',name:(P2.year||'')+' '+P2.player+' PSA 10',img:P2.img,p:Math.round(P2.last_price)};
          const worldSide={kind:'world',name:W.n,emoji:W.e,p:W.p};
          const sides=rng()<.5?[cardSide,worldSide]:[worldSide,cardSide];
          todayQ[4]={type:'versus',q:'Which costs more?',sides,ans:sides[0].p>sides[1].p?0:1,
            fact:'<b>'+cardSide.name+'</b>: '+fmt(cardSide.p)+' · <b>'+worldSide.name+'</b>: '+fmt(worldSide.p)+'. The hobby is wild.'};
        }
      }
    }
  }catch(e){}
}

function renderGrid(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  CATS.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='sq'; d.id='sq-'+i;
    d.style.setProperty('--tint',c.tint);
    const liveTag=(c.live&&todayQ[i]&&todayQ[i].type!=='trivia')?'<div class="live-dot">● LIVE</div>':'';
    d.innerHTML=liveTag+`<div class="chip">${c.ico}</div><div class="nm">${c.nm}</div>`;
    d.onclick=()=>openQ(i);
    grid.appendChild(d);
  });
  state.results.forEach((r,i)=>{ if(r!==null) markSquare(i,r); });
  document.getElementById('dealing').style.display='none';
  grid.style.display='grid';
  updateBar();
  if(state.answered===9) showResult(false);
}

function markSquare(i,right){
  const sq=document.getElementById('sq-'+i);
  sq.classList.add('done',right?'right':'wrong');
  if(!sq.querySelector('.mark')) sq.insertAdjacentHTML('beforeend',`<div class="mark">${right?'✅':'❌'}</div>`);
}
function updateBar(){
  let n=0;
  state.results.forEach((r,i)=>{ const p=document.getElementById('pip-'+i); if(r===true){p.className='pip on-right';n++;} else if(r===false){p.className='pip on-wrong';n++;} });
}

let current=null;
function openQ(i){
  if(state.results[i]!==null||!todayQ[i]) return;
  current=i;
  const c=CATS[i],q=todayQ[i];
  document.getElementById('q-card').style.setProperty('--tint',c.tint);
  document.getElementById('q-chip').textContent=c.ico;
  document.getElementById('q-chip').style.setProperty('--tint',c.tint);
  document.getElementById('q-cat').textContent=c.nm;
  document.getElementById('q-live').style.display=(c.live&&q.type!=='trivia')?'block':'none';
  document.getElementById('q-count').textContent=(state.answered+1)+' / 9';
  document.getElementById('q-text').textContent=q.q;
  const imgWrap=document.getElementById('q-img-wrap');
  if(q.type==='image'&&q.img){ document.getElementById('q-img').src=q.img; imgWrap.style.display='flex'; }
  else imgWrap.style.display='none';
  const body=document.getElementById('q-body'); body.innerHTML='';
  if(q.type==='duel'){
    const duel=document.createElement('div'); duel.className='duel';
    q.cards.forEach((card,j)=>{
      const d=document.createElement('div'); d.className='duel-card'; d.id='choice-'+j;
      d.innerHTML=`<img src="${card.img}" onerror="this.style.display='none'"/><div class="duel-name">${card.player}</div><div class="duel-meta">${card.year||''} ${card.set_name||''}</div><div class="duel-pop">POP ${card.pop.toLocaleString()}</div>`;
      d.onclick=()=>answerChoice(j,'duel-pop');
      duel.appendChild(d);
    });
    body.appendChild(duel);
  } else if(q.type==='versus'){
    const v=document.createElement('div'); v.className='versus';
    q.sides.forEach((s,j)=>{
      const d=document.createElement('div'); d.className='vs-side'; d.id='choice-'+j;
      const visual=s.kind==='card'?`<img src="${s.img}" onerror="this.style.display='none'"/>`:`<div class="vs-emoji">${s.emoji}</div>`;
      d.innerHTML=visual+`<div class="vs-name">${s.name}</div><div class="vs-price">${fmt(s.p)}</div>`;
      d.onclick=()=>answerChoice(j,'vs-price');
      if(j===0){ v.appendChild(d); const mid=document.createElement('div'); mid.className='vs-mid'; mid.textContent='VS'; v.appendChild(mid); }
      else v.appendChild(d);
    });
    body.appendChild(v);
  } else {
    const letters=['A','B','C','D'];
    q.opts.forEach((o,j)=>{
      const b=document.createElement('button');
      b.className='opt';
      b.innerHTML=`<span class="ltr">${letters[j]}</span>${o}`;
      b.onclick=()=>answer(j,b);
      body.appendChild(b);
    });
  }
  document.getElementById('q-after').classList.remove('show');
  document.getElementById('modal').classList.add('show');
}

function finishAnswer(right,fact){
  if(right) state.score++;
  state.answered++;
  state.results[current]=right;
  saveState();
  markSquare(current,right);
  updateBar();
  document.getElementById('q-fact').innerHTML=fact;
  document.getElementById('q-after').classList.add('show');
  if(state.answered===9&&meta.lastDone!==dateKey){
    const y=new Date(now-86400000);
    const yKey=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    meta.streak=(meta.lastDone===yKey)?meta.streak+1:1;
    meta.played++;
    meta.best=Math.max(meta.best,state.score);
    meta.lastDone=dateKey;
    saveMeta();
    document.getElementById('streak-n').textContent=meta.streak;
  }
}

function answer(j,btn){
  const q=todayQ[current];
  const opts=document.querySelectorAll('#q-body .opt');
  opts.forEach(o=>o.onclick=null);
  opts[q.ans].classList.add('correct');
  const right=j===q.ans;
  if(!right) btn.classList.add('incorrect');
  finishAnswer(right,q.fact);
}

function answerChoice(j,revealCls){
  const q=todayQ[current];
  document.querySelectorAll('#q-body [id^="choice-"]').forEach(d=>{d.onclick=null;d.classList.add('reveal');});
  document.getElementById('choice-'+q.ans).classList.add('correct');
  const right=j===q.ans;
  if(!right) document.getElementById('choice-'+j).classList.add('incorrect');
  finishAnswer(right,q.fact);
}

function closeModal(){
  document.getElementById('modal').classList.remove('show');
  if(state.answered===9) showResult(true);
}

function gridEmoji(){
  return state.results.map(r=>r?'🟩':'🟥').reduce((s,x,i)=>s+x+((i+1)%3===0&&i<8?'\n':''),'');
}

function showResult(scroll){
  const el=document.getElementById('result');
  document.getElementById('res-num').innerHTML=state.score+'<span>/9</span>';
  const gem=state.score===9;
  el.classList.toggle('gem',gem);
  document.getElementById('res-lbl').textContent=gem?'💎 GEM MINT BOARD 💎':'Today\'s board';
  const msgs=['Rough board. Run it back tomorrow.','The hobby is undefeated.','The market humbles everyone.','Solid collector knowledge.','You know your cardboard.','Certified hobby sicko. 🔥'];
  document.getElementById('res-msg').textContent=gem?'A perfect 9. Straight to the PC.':(state.score<=2?msgs[0]:state.score<=4?msgs[1]:state.score<=5?msgs[2]:state.score<=6?msgs[3]:msgs[4]);
  document.getElementById('res-grid').textContent=gridEmoji();
  document.getElementById('rs-streak').textContent=meta.streak;
  document.getElementById('rs-played').textContent=meta.played;
  document.getElementById('rs-best').textContent=meta.best+'/9';
  el.classList.add('show');
  if(gem){
    const em=['💎','✨','🃏','🏆','⭐'];
    for(let i=0;i<26;i++){
      const c=document.createElement('div');
      c.className='confetti';
      c.textContent=em[Math.floor(Math.random()*em.length)];
      c.style.left=(Math.random()*100)+'%';
      c.style.animationDuration=(1.6+Math.random()*1.8)+'s';
      c.style.animationDelay=(Math.random()*1.2)+'s';
      el.appendChild(c);
    }
  }
  if(scroll) el.scrollIntoView({behavior:'smooth'});
  tickCountdown(); setInterval(tickCountdown,1000);
}

function tickCountdown(){
  const mid=new Date(now); mid.setHours(24,0,0,0);
  let s=Math.max(0,Math.floor((mid-new Date())/1000));
  document.getElementById('countdown').textContent=Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m '+String(s%60).padStart(2,'0')+'s';
}

function copyShare(){
  const gem=state.score===9;
  const txt='Cardverse Daily 9 — Board #'+dayNum+'\n'+state.score+'/9'+(gem?' 💎 GEM MINT':'')+'\n'+gridEmoji();
  navigator.clipboard.writeText(txt).then(()=>{
    const t=document.getElementById('toast');
    t.textContent='Copied — paste it in the group chat 📋';
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2200);
  });
}

buildLive().finally(renderGrid);
</script>
