<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Cardverse — Sign In</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f0e17;--s:#1a1928;--s2:#232235;--b:rgba(255,255,255,.09);--t:#f2f0ff;--m:rgba(242,240,255,.5);--a:#7c6cfc;--g:#3ecf8e;--r:#fc6c6c;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--t);font-family:'Nunito',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle linear infinite;}
@keyframes twinkle{0%,100%{opacity:.06}50%{opacity:.7}}
.wrap{width:100%;max-width:400px;position:relative;z-index:1;}

.logo-area{text-align:center;margin-bottom:2rem;}
.logo{font-size:30px;font-weight:900;letter-spacing:-.5px;}
.logo span{color:var(--a);}
.tagline{font-size:13px;color:var(--m);font-weight:700;margin-top:5px;}

.card{background:var(--s);border:1px solid var(--b);border-radius:20px;padding:1.75rem 1.5rem;}

/* tabs */
.tabs{display:flex;background:var(--s2);border-radius:12px;padding:4px;margin-bottom:1.5rem;}
.tab{flex:1;text-align:center;padding:.5rem;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer;color:var(--m);transition:all .15s;border:none;background:none;font-family:'Nunito',sans-serif;}
.tab.active{background:var(--a);color:#fff;}

/* fields */
.field{margin-bottom:1rem;}
label{font-size:11px;font-weight:800;color:var(--m);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:.35rem;}
input{width:100%;background:var(--s2);border:1.5px solid var(--b);border-radius:10px;color:var(--t);font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;padding:.7rem 1rem;outline:none;transition:border .15s;}
input:focus{border-color:var(--a);}
input::placeholder{color:rgba(242,240,255,.2);}

.btn{width:100%;border:none;border-radius:99px;background:var(--a);color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:15px;padding:.85rem;cursor:pointer;transition:all .15s;box-shadow:0 4px 18px rgba(124,108,252,.35);margin-top:.25rem;}
.btn:hover{background:#9280ff;transform:translateY(-1px);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.msg{font-size:13px;font-weight:700;text-align:center;padding:.65rem 1rem;border-radius:10px;margin-top:1rem;display:none;}
.msg.err{background:rgba(252,108,108,.12);color:var(--r);display:block;border:1px solid rgba(252,108,108,.25);}
.msg.ok{background:rgba(62,207,142,.12);color:var(--g);display:block;border:1px solid rgba(62,207,142,.25);}

.forgot{text-align:center;font-size:12px;color:var(--m);margin-top:.75rem;cursor:pointer;font-weight:700;}
.forgot:hover{color:var(--t);}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="wrap">
  <div class="logo-area">
    <div class="logo">Cardverse <span>Mini Games</span></div>
    <div class="tagline">The hobby's game room 🃏</div>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-in"  onclick="switchTab('in')">Sign In</button>
      <button class="tab"        id="tab-up"  onclick="switchTab('up')">Create Account</button>
    </div>

    <!-- SIGN IN -->
    <div id="panel-in">
      <div class="field"><label>Email</label>
        <input id="in-email" type="email" placeholder="you@email.com" autocomplete="email"/>
      </div>
      <div class="field"><label>Password</label>
        <input id="in-pw" type="password" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <button class="btn" id="btn-in" onclick="doLogin()">Sign In</button>
      <div class="forgot" onclick="doForgot()">Forgot password?</div>
    </div>

    <!-- CREATE ACCOUNT -->
    <div id="panel-up" style="display:none;">
      <div class="field"><label>Username</label>
        <input id="up-username" type="text" placeholder="CardKing99" maxlength="20" autocomplete="off"
          oninput="this.value=this.value.replace(/[^a-zA-Z0-9_]/g,'')"/>
      </div>
      <div class="field"><label>Email</label>
        <input id="up-email" type="email" placeholder="you@email.com" autocomplete="email"/>
      </div>
      <div class="field"><label>Password</label>
        <input id="up-pw" type="password" placeholder="Min 6 characters" autocomplete="new-password"
          onkeydown="if(event.key==='Enter')doSignup()"/>
      </div>
      <button class="btn" id="btn-up" onclick="doSignup()">Create Account</button>
    </div>

    <div class="msg" id="msg"></div>

    <div style="display:flex;align-items:center;gap:.75rem;margin-top:1.1rem;">
      <div style="flex:1;height:1px;background:var(--b);"></div>
      <span style="font-size:12px;color:var(--m);font-weight:700;">or</span>
      <div style="flex:1;height:1px;background:var(--b);"></div>
    </div>

    <button onclick="playAsGuest()" style="width:100%;border:1.5px solid var(--b);border-radius:99px;background:transparent;color:var(--m);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;padding:.8rem;cursor:pointer;margin-top:.85rem;transition:all .15s;" onmouseover="this.style.borderColor='rgba(124,108,252,.5)';this.style.color='var(--t)'" onmouseout="this.style.borderColor='var(--b)';this.style.color='var(--m)'">
      Continue as Guest
    </button>
    <div style="font-size:11px;color:var(--m);text-align:center;margin-top:.5rem;opacity:.7;">Scores won't be saved · No account needed</div>
  </div>
</div>

<script>
const SB_URL  = 'https://nwzsomfhidefbldsloxz.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53enNvbWZoaWRlZmJsZHNsb3h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODY3MTAsImV4cCI6MjA5MDQ2MjcxMH0.YmXfQ4DtaYVP09fvAuPTveYSKxqXxw3kcXxGGcJH-jA';
const sb = supabase.createClient(SB_URL, SB_ANON);

// Stars
const starsEl = document.getElementById('stars');
for(let i=0;i<60;i++){
  const s=document.createElement('div'); s.className='star';
  const sz=Math.random()*2+.5;
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*3}s;`;
  starsEl.appendChild(s);
}

// Already logged in → go straight to home
(async()=>{
  const {data:{session}} = await sb.auth.getSession();
  if(session) window.location.href='home.html';
})();

function switchTab(t){
  document.getElementById('panel-in').style.display = t==='in'?'block':'none';
  document.getElementById('panel-up').style.display = t==='up'?'block':'none';
  document.getElementById('tab-in').classList.toggle('active', t==='in');
  document.getElementById('tab-up').classList.toggle('active', t==='up');
  showMsg('','');
}
function showMsg(txt,type){
  const el=document.getElementById('msg');
  el.textContent=txt; el.className='msg'+(type?' '+type:'');
}
function setBtn(id,loading,label){
  const b=document.getElementById(id);
  b.disabled=loading;
  b.innerHTML=loading?'<span class="spinner"></span>One sec...':label;
}

async function doLogin(){
  const email=document.getElementById('in-email').value.trim();
  const pw=document.getElementById('in-pw').value;
  if(!email||!pw){showMsg('Fill in all fields','err');return;}
  setBtn('btn-in',true,'Sign In');
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){showMsg(error.message,'err');setBtn('btn-in',false,'Sign In');}
  else{showMsg('Welcome back! Loading...','ok');setTimeout(()=>window.location.href='home.html',700);}
}

async function doSignup(){
  const username=document.getElementById('up-username').value.trim();
  const email=document.getElementById('up-email').value.trim();
  const pw=document.getElementById('up-pw').value;
  if(!username||!email||!pw){showMsg('Fill in all fields','err');return;}
  if(username.length<3){showMsg('Username needs at least 3 characters','err');return;}
  if(pw.length<6){showMsg('Password needs at least 6 characters','err');return;}
  setBtn('btn-up',true,'Create Account');

  // Check username not taken
  const {data:ex}=await sb.from('profiles').select('id').eq('username',username).maybeSingle();
  if(ex){showMsg('That username is taken — try another','err');setBtn('btn-up',false,'Create Account');return;}

  const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{username}}});
  if(error){showMsg(error.message,'err');setBtn('btn-up',false,'Create Account');}
  else{
    // Create profile row immediately
    if(data?.user){
      await sb.from('profiles').upsert({id:data.user.id,username,total_pts:0,best_streak:0,skin:'base',owned_skins:['base','green']});
    }
    showMsg('Account created! Check your email to verify, then sign in.','ok');
    setTimeout(()=>switchTab('in'),2500);
    setBtn('btn-up',false,'Create Account');
  }
}

async function doForgot(){
  const email=document.getElementById('in-email').value.trim();
  if(!email){showMsg('Enter your email above first','err');return;}
  await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/login.html'});
  showMsg('Reset email sent — check your inbox','ok');
}

function playAsGuest(){
  // Set guest flag in sessionStorage so game knows not to try cloud save
  sessionStorage.setItem('cv_guest', '1');
  window.location.href = 'home.html';
}
</script>
</body>
</html>
